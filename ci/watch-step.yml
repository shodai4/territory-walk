# Apple Watch（コンパニオン）を CI のビルドに組み込むステップ
#
# 挿入位置: 「Verify iOS Project Pods / Workspace」（pod install を含む）の直後、
#           「Compile & Verify iOS Build (Clean Build)」の前。
#           理由: pod install は App ターゲットの build phase を触るため、
#                 Watch ターゲット追加は pod install の後に実行する。
#
# 挿入は scripts/apply-watch-workflow-step.js が行う（冪等）。
#   node scripts/apply-watch-workflow-step.js
#
# このステップはリポジトリ変数 ENABLE_WATCH_TARGET が true のときだけ走る。
# 変数が無い/ false のあいだは、従来どおり iOS 単体でクリーンビルド＆配信する。
# Watch 用 Bundle ID（com.oekaki.territorywalk.watchkitapp）を ASC に登録したあとに
# 変数を true にすること（未登録のままアップロードまで進むと署名・検証で落ちる）。

      - name: "Add watchOS companion target (optional, vars.ENABLE_WATCH_TARGET=true)"
        if: vars.ENABLE_WATCH_TARGET == 'true'
        env:
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: |
          set -e
          echo "=== xcodeproj gem ==="
          ruby -e "require 'xcodeproj'; puts 'xcodeproj ' + Xcodeproj::VERSION" \
            || gem install xcodeproj --no-document

          echo "=== Watch icons + silent sound ==="
          python3 scripts/generate-watch-assets.py

          echo "=== Copy Watch sources / bridge into generated iOS project ==="
          node scripts/configure-watch.js

          echo "=== Add Watch target to pbxproj ==="
          ruby scripts/add-watch-target.rb \
            || WATCH_EMBED=plugins ruby scripts/add-watch-target.rb

          echo "=== Targets after injection ==="
          xcodebuild -list -project ios/App/App.xcodeproj
