<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TERRITORY WALK - 白黒歩行陣取りアプリ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white overflow-hidden h-screen w-screen flex flex-col m-0 p-0">

    <!-- ヘッダー：黒基調のミニマルなステータスバー -->
    <header class="absolute top-0 left-0 right-0 z-[1000] bg-black/85 backdrop-blur-md border-b border-zinc-800 px-4 py-2.5 flex items-center justify-between text-xs md:text-sm select-none shadow-lg">
        <!-- タイトル -->
        <div class="font-bold tracking-widest text-zinc-100 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
            TERRITORY WALK
        </div>

        <!-- 白黒スコア比率バー -->
        <div class="flex items-center gap-3 flex-1 max-w-xs mx-4">
        <!-- タイトル & 残り時間メニューボタン -->
        <div class="flex items-center gap-3">
            <div class="font-bold tracking-widest text-zinc-100 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                TERRITORY WALK
            </div>
            <button id="btn-reset-timer" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-700/80 text-[10px] font-mono text-zinc-300 px-2 py-1 rounded-lg flex items-center gap-1 shadow transition-all">
                <svg class="w-3 h-3 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="reset-countdown-text">リセットまで: 計算中...</span>
            </button>
        </div>
            <div class="flex items-center gap-1 text-zinc-400 font-mono text-[11px]">
                <span id="score-black" class="text-white font-bold">50%</span>
            </div>
            <div class="flex-1 h-2.5 bg-zinc-800 rounded-full overflow-hidden flex border border-zinc-700 shadow-inner">
                <div id="bar-black" class="bg-zinc-100 transition-all duration-500" style="width: 50%;"></div>
                <div id="bar-white" class="bg-zinc-600 transition-all duration-500" style="width: 50%;"></div>
            </div>
            <div class="flex items-center gap-1 text-zinc-400 font-mono text-[11px]">
                <span id="score-white" class="text-zinc-400 font-bold">50%</span>
            </div>
        </div>

        <!-- 現在チーム表示 -->
        <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-700/60 px-3 py-1 rounded-full font-mono text-xs">
            <span class="text-zinc-400">TEAM:</span>
            <div id="team-badge-container" class="flex items-center gap-1.5 font-bold uppercase tracking-wider">
                <!-- JSで動的切替 -->
            </div>
        </div>
    </header>

    <!-- 地図コンテナ -->
    <main id="map" class="flex-1 w-full h-full z-0"></main>

    <!-- 右下：テスト用仮想散歩 D-Pad (十字キー) -->
    <div id="dpad-container" class="absolute bottom-20 right-4 z-[1000] bg-black/80 backdrop-blur-md border border-zinc-800 p-2.5 rounded-2xl shadow-2xl select-none flex flex-col items-center gap-1">
        <div class="text-[9px] text-zinc-400 font-mono tracking-wider mb-0.5">VIRTUAL D-PAD</div>
        <button id="dpad-up" class="w-10 h-10 bg-zinc-900 hover:bg-zinc-800 active:bg-zinc-700 border border-zinc-700 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow transition-all active:scale-95">▲</button>
        <div class="flex items-center gap-6">
            <button id="dpad-left" class="w-10 h-10 bg-zinc-900 hover:bg-zinc-800 active:bg-zinc-700 border border-zinc-700 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow transition-all active:scale-95">◀</button>
            <div class="w-10 h-10 flex items-center justify-center bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-400 text-xs font-mono">●</div>
            <button id="dpad-right" class="w-10 h-10 bg-zinc-900 hover:bg-zinc-800 active:bg-zinc-700 border border-zinc-700 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow transition-all active:scale-95">▶</button>
        </div>
        <button id="dpad-down" class="w-10 h-10 bg-zinc-900 hover:bg-zinc-800 active:bg-zinc-700 border border-zinc-700 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow transition-all active:scale-95">▼</button>
    </div>

    <!-- フッター：座標、GPSステータスバッジ、自機リセンターボタン -->
    <footer class="absolute bottom-4 left-4 right-4 z-[1000] flex items-center justify-between pointer-events-none select-none">
        <!-- 左側：現在地座標 & GPSステータスバッジ -->
        <div class="flex items-center gap-2 pointer-events-auto bg-black/85 backdrop-blur-md border border-zinc-800 px-3.5 py-2 rounded-xl shadow-xl text-xs font-mono">
            <div id="gps-badge" class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-400 text-[10px] font-bold border border-zinc-700">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping" id="gps-dot"></span>
                <span id="gps-text">GPS SEARCH</span>
            </div>
            <div class="text-zinc-300 flex items-center gap-1.5 pl-1 border-l border-zinc-800">
                <span class="text-zinc-500">LAT:</span><span id="lat-val">34.6654</span>
    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Manager -->
    <script src="supabase.js"></script>
                <span class="text-zinc-500 ml-1">LNG:</span><span id="lng-val">135.6268</span>
            </div>
        </div>

        <!-- 右側：自機リセンターボタン -->
        <div class="pointer-events-auto">
            <button id="btn-recenter" class="bg-black/90 hover:bg-zinc-900 active:bg-zinc-800 text-white border border-zinc-700/80 hover:border-zinc-500 px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 text-xs font-mono font-bold transition-all transform active:scale-95">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>RECENTER</span>
            </button>
        </div>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Supabase JS v2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase Manager -->
    <script src="supabase.js"></script>
    <!-- Grid JS -->
    <script src="grid.js"></script>
    <!-- App JS -->
    <script src="app.js"></script>
</body>
</html>
